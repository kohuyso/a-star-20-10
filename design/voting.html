<script>
  function selectCandidate(selectedEl) {
    const list = document.getElementById('candidate-list');
    const rows = list.querySelectorAll('.candidate-row');

    rows.forEach(row => {
      row.setAttribute('aria-checked', 'false');
      // Reset container style
      row.className = 'candidate-row group flex items-center justify-between w-full min-h-[54px] px-4 py-3 rounded-[12px] bg-surface-container shadow-none text-left transition-all active:scale-[0.98]';
      
      // Reset radio circle
      const radioBox = row.querySelector('div.flex.items-center.justify-center');
      if (radioBox) {
        radioBox.className = 'flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest shadow-inner';
        radioBox.innerHTML = '<div class="w-4 h-4 rounded-full bg-surface"></div>';
      }

      // Reset text
      const nameSpan = row.querySelector('span.truncate');
      if (nameSpan) {
        nameSpan.className = 'font-label-lg text-label-lg text-on-surface truncate';
      }

      // Reset checkmark icon
      const checkIcon = row.querySelector('.material-symbols-outlined');
      if (checkIcon) {
        checkIcon.className = 'material-symbols-outlined text-outline-variant text-[20px] opacity-0 transition-opacity';
      }
    });

    // Apply active selected styling to clicked row
    selectedEl.setAttribute('aria-checked', 'true');
    selectedEl.className = 'candidate-row group flex items-center justify-between w-full min-h-[54px] px-4 py-3 rounded-[12px] bg-primary-container/10 shadow-sm text-left transition-all active:scale-[0.98]';

    const activeRadioBox = selectedEl.querySelector('div.flex.items-center.justify-center');
    if (activeRadioBox) {
      activeRadioBox.className = 'relative flex items-center justify-center w-6 h-6 rounded-full bg-primary-container shadow-sm transition-transform';
      activeRadioBox.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-surface-container-lowest"></div>';
    }

    const activeNameSpan = selectedEl.querySelector('span.truncate');
    if (activeNameSpan) {
      activeNameSpan.className = 'font-label-lg text-label-lg text-primary truncate';
    }

    const activeCheckIcon = selectedEl.querySelector('.material-symbols-outlined');
    if (activeCheckIcon) {
      activeCheckIcon.className = 'material-symbols-outlined text-primary text-[20px] transition-opacity opacity-100';
    }
  }

  function handleVoteSubmission() {
    const btn = document.getElementById('submit-vote-btn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Đang ghi nhận...</span>';
    btn.disabled = true;

    setTimeout(() => {
      btn.className = 'w-full max-w-[380px] h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-lg flex items-center justify-center gap-2 transition-all';
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: \'FILL\' 1;">verified</span><span>Đã hoàn tất</span>';
    }, 600);
  }
